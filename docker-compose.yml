services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-auction_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-auction_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-auction_dev}?schema=public
      API_PORT: 3333
    env_file:
      - ./apps/api/.env.development
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "bunx prisma migrate deploy && bun run dev"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333
    command: bun run --cwd apps/web dev:docker
    depends_on:
      - api
    volumes:
      - ./package.json:/app/package.json
      - ./infra:/app/infra
      - ./apps/web:/app/apps/web
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/node_modules

  storybook:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "6006:6006"
    command: bun run --cwd packages/ui storybook -- --host 0.0.0.0
    volumes:
      - ./package.json:/app/package.json
      - ./infra:/app/infra
      - ./apps/web:/app/apps/web
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/node_modules

volumes:
  postgres_data:
